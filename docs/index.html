
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clasificador de Carros y Motos</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #141824;
            color: white;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #222839;
            padding: 35px;
            border-radius: 16px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 8px 30px #0005;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 10px;
        }

        p {
            color: #bfc6d5;
        }

        input[type="file"] {
            margin: 25px 0;
            width: 100%;
            max-width: 300px;
        }

        #image-preview {
            display: none;
            max-width: 100%;
            max-height: 300px;
            margin: 15px auto;
            border-radius: 10px;
            object-fit: contain;
        }

        .result {
            background: #30384b;
            padding: 14px;
            margin-top: 12px;
            border-radius: 8px;
            text-align: left;
        }

        .bar {
            background: #151a27;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
            margin-top: 10px;
        }

        .fill {
            background: #48c78e;
            height: 100%;
            transition: width 0.3s;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Clasificador de Imágenes</h1>

    <p>Inteligencia Artificial para reconocer carros y motos</p>

    <input
        type="file"
        id="image-upload"
        accept="image/*"
        disabled
    >

    <img id="image-preview" alt="Imagen seleccionada">

    <p id="status">Cargando modelo de IA...</p>

    <div id="label-container"></div>

</div>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>

<!-- Teachable Machine -->
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script>
    // Dirección de tu modelo entrenado
    const MODEL_URL =
        "https://teachablemachine.withgoogle.com/models/XidxdWcOJ/";

    let model = null;

    const upload = document.getElementById("image-upload");
    const preview = document.getElementById("image-preview");
    const container = document.getElementById("label-container");
    const status = document.getElementById("status");

    // Cargar el modelo
    async function loadModel() {
        try {
            model = await tmImage.load(
                MODEL_URL + "model.json",
                MODEL_URL + "metadata.json"
            );

            status.textContent = "Modelo cargado. Selecciona una imagen.";
            upload.disabled = false;

        } catch (error) {
            console.error("Error al cargar el modelo:", error);
            status.textContent =
                "No se pudo cargar el modelo. Revisa la conexión y la consola.";
        }
    }

    // Clasificar la imagen seleccionada
    upload.addEventListener("change", async function(event) {
        const file = event.target.files[0];

        if (!file || !model) return;

        container.innerHTML = "";
        status.textContent = "Analizando imagen...";

        const imageURL = window.URL.createObjectURL(file);

        try {
            preview.onload = async function() {
                try {
                    const predictions = await model.predict(preview);

                    predictions.sort(
                        (a, b) => b.probability - a.probability
                    );

                    container.innerHTML = "";

                    predictions.forEach(prediction => {
                        const percentage =
                            (prediction.probability * 100).toFixed(1);

                        const result = document.createElement("div");
                        result.className = "result";

                        const name = document.createElement("strong");
                        name.textContent =
                            prediction.className + ": " + percentage + "%";

                        const bar = document.createElement("div");
                        bar.className = "bar";

                        const fill = document.createElement("div");
                        fill.className = "fill";
                        fill.style.width = percentage + "%";

                        bar.appendChild(fill);
                        result.appendChild(name);
                        result.appendChild(bar);
                        container.appendChild(result);
                    });

                    status.textContent = "Análisis completado.";

                } catch (error) {
                    console.error(error);
                    status.textContent = "Error al analizar la imagen.";
                } finally {
                    window.URL.revokeObjectURL(imageURL);
                }
            };

            preview.onerror = function() {
                status.textContent = "No se pudo abrir la imagen.";
                window.URL.revokeObjectURL(imageURL);
            };

            preview.style.display = "block";
            preview.src = imageURL;

        } catch (error) {
            console.error(error);
            status.textContent = "Error al procesar el archivo.";
            window.URL.revokeObjectURL(imageURL);
        }
    });

    // Iniciar la carga del modelo
    loadModel();
</script>

</body>
</html>
