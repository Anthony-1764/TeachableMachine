<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Clasificador por Archivo</title>
</head>
<body>

    <h2>Clasificador de Imágenes (Carro / Moto)</h2>

    <!-- Cargar imagen desde la computadora -->
    <input type="file" id="image-upload" accept="image/*" onchange="predictImage(event)">
    <br><br>

    <!-- Vista previa de la imagen cargada -->
    <img id="image-preview" width="200" alt="Vista previa de la imagen" style="display:none;">
    
    <!-- Contenedor para los resultados -->
    <div id="label-container"></div>

    <!-- Librerías de TensorFlow.js y Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/XidxdWcOJ/";
        let model, labelContainer, maxPredictions;

        // Carga el modelo al abrir la página
        async function loadModel() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        // Procesa la imagen seleccionada y realiza la predicción
        async function predictImage(event) {
            if (!model) await loadModel();

            const file = event.target.files[0];
            if (!file) return;

            const imgElement = document.getElementById("image-preview");
            imgElement.src = URL.createObjectURL(file);
            imgElement.style.display = "block";

            // Esperar a que la imagen se cargue en el DOM para procesarla
            imgElement.onload = async () => {
                const prediction = await model.predict(imgElement);
                for (let i = 0; i < maxPredictions; i++) {
                    const classPrediction =
                        prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(1) + "%";
                    labelContainer.childNodes[i].innerHTML = classPrediction;
                }
            };
        }

        // Cargar el modelo al iniciar
        loadModel();
    </script>

</body>
</html>
